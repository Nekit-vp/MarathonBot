services:
  db:
    image: postgres:12-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-marathonbot}
      POSTGRES_USER: ${DB_USERNAME:-marathonbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - marathon_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-marathonbot}
      DB_USERNAME: ${DB_USERNAME:-marathonbot}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-MarathonBot}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?Set TELEGRAM_BOT_USERNAME in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      SUPERADMIN_TELEGRAM_ID: ${SUPERADMIN_TELEGRAM_ID:-0}
      GAMIFICATION_MANAGER_ENABLE_AVAILABLE: ${GAMIFICATION_MANAGER_ENABLE_AVAILABLE:-true}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}

volumes:
  marathon_data:
